plugins {
    id 'java'
    id 'application'
}

group = 'com.novis'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // Bouncy Castle – cryptography
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.78'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.78'

    // Netty – high-performance networking
    implementation 'io.netty:netty-all:4.1.100.Final'

    // SQL Database (H2 for in-memory / SQLite for local)
    implementation 'org.xerial:sqlite-jdbc:3.42.0.0'
    implementation 'com.h2database:h2:2.2.224'

    // Perceptual Hashing (Image/Video moderation – DHash)
    // SOLVED: FOUND PERCEPTUAL HASHING LIBRARY
    implementation 'dev.brachtendorf:JImageHash:1.0.0'

    // JSON handling (for configs and message serialization)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.0'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.16.0'

    // byte serialization
    implementation 'com.esotericsoftware:kryo:5.5.0' // latest stable

    // SLF4J with Logback – logging
    implementation 'ch.qos.logback:logback-classic:1.4.14'
    implementation 'org.slf4j:slf4j-api:2.0.9'

    // Guava – utilities for caching, collections, hashing
    implementation 'com.google.guava:guava:32.1.2-jre'

    // Optional: Argon2 for password hashing
    implementation 'de.mkammerer:argon2-jvm:2.11'

    // Optional: QR code support for onboarding
    implementation 'com.google.zxing:core:3.5.1'

    // Optional: For JSON Web Tokens (JWT), if needed
    implementation 'com.auth0:java-jwt:4.4.0'
}

application {
    mainClass = 'com.novis.Main' // change this to your actual main class
}
